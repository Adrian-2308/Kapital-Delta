<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#00C73C}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* Carrusel del hero */
.kd-hero-stage{display:grid}
.kd-slide{grid-area:1/1;display:flex;flex-wrap:wrap;gap:48px;align-items:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s ease,visibility .6s}
.kd-slide.is-active{opacity:1;visibility:visible;pointer-events:auto}
.kd-hero-btn{background:#00C73C;color:#23201F;font-weight:700;font-size:16px;font-family:'Montserrat',sans-serif;padding:16px 28px;border-radius:8px;border:0;cursor:pointer}
.kd-hero-btn:hover{opacity:.9}
.kd-arrow{width:44px;height:44px;border-radius:50%;border:1px solid #FFFFFF;background:transparent;color:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.kd-arrow:hover{border-color:#00C73C;color:#00C73C}
.kd-dot{width:12px;height:12px;border-radius:50%;border:1px solid #FFFFFF;background:transparent;cursor:pointer;padding:0}
.kd-dot.is-active{background:#00C73C;border-color:#00C73C}
@media (prefers-reduced-motion:reduce){.kd-slide{transition:none}}

/* Botón flotante de WhatsApp */
.kd-wa{position:fixed;right:20px;bottom:20px;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;z-index:9999;display:block;border-radius:50%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));transition:transform .2s ease}
.kd-wa:hover{transform:scale(1.08)}
.kd-wa img{width:100%;height:100%;display:block}

/* Equipo */
.kd-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px}
.kd-member{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;background:#3E3E3E;border:1px solid #3F3F3F;border-radius:16px;padding:32px 20px 28px;overflow:hidden;transition:transform .25s ease,border-color .25s ease}
.kd-member::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#00C73C;transform:scaleX(0);transform-origin:center;transition:transform .3s ease}
.kd-member:hover{transform:translateY(-6px);border-color:#00C73C}
.kd-member:hover::before{transform:scaleX(1)}
.kd-photo{width:112px;height:112px;border-radius:50%;overflow:hidden;margin-bottom:20px;border:3px solid #00C73C;padding:3px;box-sizing:border-box;background:#23201F}
.kd-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.kd-name{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;line-height:1.35;color:#FFFFFF;letter-spacing:.3px;min-height:2.7em;display:flex;align-items:center;justify-content:center}
.kd-divider{width:32px;height:2px;background:#00C73C;margin:12px 0;border-radius:2px}
.kd-amv{margin-top:10px;display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(0,199,60,.14);border:1px solid rgba(0,199,60,.55);font-size:11.5px;font-weight:700;color:#FFFFFF;letter-spacing:.3px;line-height:1.3}
.kd-email{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);width:100%;box-sizing:border-box;font-size:12px;font-weight:500;color:rgba(255,255,255,.82);overflow-wrap:anywhere;line-height:1.4;transition:color .25s ease}
.kd-member:hover .kd-email{color:#00C73C}
a.kd-member{color:inherit;text-decoration:none;cursor:pointer}
.kd-role{font-size:13px;font-weight:500;color:#00C73C;line-height:1.4}
@media (max-width:520px){
.kd-team-grid{grid-template-columns:repeat(2,1fr);gap:16px}
.kd-member{padding:24px 12px 20px}
.kd-photo{width:88px;height:88px;margin-bottom:16px}
.kd-name{font-size:13px}
.kd-role{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.kd-member,.kd-member::before{transition:none}.kd-member:hover{transform:none}}

/* ===== MEJORAS VISUALES ===== */
body{font-family:'Montserrat',sans-serif;text-rendering:optimizeLegibility}
section[id]{scroll-margin-top:24px}
::selection{background:#00C73C;color:#23201F}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #00C73C!important;outline-offset:3px;border-radius:6px}
h1,h2,h3{letter-spacing:-.02em;text-wrap:balance}
h1{line-height:1.05!important}
p{text-wrap:pretty}
section p[style*="letter-spacing:2px"]{display:flex;align-items:center;gap:12px}
section p[style*="letter-spacing:2px"]::before{content:"";width:28px;height:2px;background:#00C73C;border-radius:2px;flex:none}
nav a:not([href="#contacto"]){position:relative;padding:6px 0;transition:color .25s ease}
nav a:not([href="#contacto"])::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:#00C73C;transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
nav a:not([href="#contacto"]):hover::after{transform:scaleX(1)}
nav a[href="#contacto"]{transition:transform .25s ease,box-shadow .25s ease}
nav a[href="#contacto"]:hover{color:#23201F;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,199,60,.35)}
.kd-hero-btn{transition:transform .25s ease,box-shadow .25s ease,opacity .25s ease;box-shadow:0 6px 20px rgba(0,199,60,.25)}
.kd-hero-btn:hover{opacity:1;transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,199,60,.4)}
.kd-hero-btn:active{transform:translateY(0)}
.kd-slide>div:last-child{box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 6px rgba(0,199,60,.08);transform:translateY(12px) scale(.98);transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.kd-slide.is-active>div:last-child{transform:none}
.kd-slide>div:last-child img{transition:transform 6s ease}
.kd-slide.is-active>div:last-child img{transform:scale(1.06)}
.kd-arrow{transition:all .25s ease}
.kd-arrow:hover{background:#00C73C;color:#23201F;transform:scale(1.08)}
.kd-dot{transition:all .3s ease}
.kd-dot.is-active{width:32px;border-radius:6px}
#simulador>div{box-shadow:0 30px 70px rgba(0,0,0,.4)}
#simulador>div>div:last-child{box-shadow:inset 0 0 0 1px rgba(0,199,60,.15),0 12px 40px rgba(0,0,0,.35)}
#simulador input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#simulador input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:#FFFFFF}
#simulador input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:#FFFFFF}
#simulador input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#00C73C;border:3px solid #23201F;margin-top:-8px;box-shadow:0 0 0 3px rgba(0,199,60,.35);transition:transform .2s ease}
#simulador input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#00C73C;border:3px solid #23201F;box-shadow:0 0 0 3px rgba(0,199,60,.35)}
#simulador input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
#simulador .sim-num{position:relative;margin-bottom:6px}
#simulador .sim-num span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#00C73C;font-weight:700;pointer-events:none}
#simulador .sim-num input{width:100%;box-sizing:border-box;padding:10px 14px 10px 32px;background:#23201F;color:#FFFFFF;border:1px solid #FFFFFF;border-radius:10px;font:inherit;font-size:16px;font-weight:700;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
#simulador .sim-num input:focus{border-color:#00C73C;box-shadow:0 0 0 3px rgba(0,199,60,.25)}
#sim-bar{transition:width .35s ease}
section[style*="border-top:1px solid #FFFFFF;border-bottom"]>div{position:relative;padding-left:20px}
section[style*="border-top:1px solid #FFFFFF;border-bottom"]>div::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:#00C73C}
#servicios>div>div,#trabaja>div>div{position:relative;overflow:hidden;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}
#servicios>div>div::before,#trabaja>div>div::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#00C73C;transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
#servicios>div>div:hover,#trabaja>div>div:hover{transform:translateY(-6px);border-color:#00C73C!important;box-shadow:0 18px 40px rgba(0,0,0,.4)}
#servicios>div>div:hover::before,#trabaja>div>div:hover::before{transform:scaleX(1)}
#servicios>div>div>svg,#servicios>div>div>.kd-svc-emoji{padding:12px;box-sizing:content-box;border-radius:14px;background:rgba(0,199,60,.1);transition:transform .3s ease}
#servicios>div>div:hover>svg,#servicios>div>div:hover>.kd-svc-emoji{transform:scale(1.08) rotate(-4deg)}
.kd-svc-emoji{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;font-size:28px;line-height:1}
.kd-amv svg{vertical-align:-3px;margin-right:6px}
.kd-member:hover{box-shadow:0 18px 40px rgba(0,0,0,.4)}
.kd-photo{transition:box-shadow .3s ease}
.kd-member:hover .kd-photo{box-shadow:0 0 0 6px rgba(0,199,60,.18)}
#contacto{box-shadow:0 30px 70px rgba(0,0,0,.35);position:relative;overflow:hidden}
#contacto::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#00C73C}
footer{letter-spacing:.2px}
.kd-wa::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(0,199,60,.55);animation:kd-pulse 2.4s ease-out infinite;pointer-events:none}
@keyframes kd-pulse{to{box-shadow:0 0 0 20px rgba(0,199,60,0)}}
.kd-js .kd-reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.kd-js .kd-reveal.is-in{opacity:1;transform:none}
@media (max-width:640px){
h1{font-size:38px!important}
.kd-slide h2{font-size:34px!important}
section h2{font-size:30px!important}
}
@media (prefers-reduced-motion:reduce){
.kd-wa::after{animation:none}
.kd-js .kd-reveal{opacity:1;transform:none;transition:none}
.kd-slide>div:last-child,.kd-slide>div:last-child img{transition:none;transform:none!important}
}

/* Diagnóstico Financiero */
#diagnostico{scroll-margin-top:16px}
.kd-dx-card{background:#3E3E3E;border:1px solid #FFFFFF;border-radius:20px;padding:40px;box-sizing:border-box}
.kd-dx-eyebrow{margin:0 0 12px;color:#00C73C;font-weight:700;letter-spacing:2px;font-size:13px}
.kd-dx h2,.kd-dx h3{font-family:'Montserrat',sans-serif;line-height:1.2;margin:0}
.kd-dx h2{font-size:36px;margin-bottom:16px}
.kd-dx p{margin:0 0 16px}
.kd-dx-btn{background:#00C73C;color:#23201F;font-weight:700;font-size:16px;font-family:'Montserrat',sans-serif;padding:16px 28px;border-radius:8px;border:0;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.kd-dx-btn:hover{opacity:.9;color:#23201F}
.kd-dx-ghost{background:transparent;color:#FFFFFF;border:1px solid #FFFFFF;font-family:'Montserrat',sans-serif;font-weight:500;font-size:14px;padding:12px 20px;border-radius:8px;cursor:pointer}
.kd-dx-ghost:hover:not(:disabled){border-color:#00C73C;color:#00C73C}
.kd-dx-ghost:disabled{opacity:.35;cursor:default}
.kd-dx-grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:24px 0 32px}
.kd-dx-pill{border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:20px;background:rgba(0,0,0,.18)}
.kd-dx-pill b{display:block;font-family:'Montserrat',sans-serif;font-size:17px;margin-bottom:6px}
.kd-dx-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:0 0 28px}
.kd-dx-bar>i{display:block;height:100%;width:0;background:#00C73C;transition:width .4s ease}
.kd-dx-opt{display:block;width:100%;text-align:left;background:transparent;color:#FFFFFF;border:1px solid #FFFFFF;border-radius:12px;padding:16px 18px;margin:0 0 12px;font-family:inherit;font-size:16px;cursor:pointer;min-height:44px;transition:border-color .2s,background .2s}
.kd-dx-opt:hover,.kd-dx-opt:focus-visible{border-color:#00C73C;background:rgba(0,199,60,.1)}
.kd-dx-opt.is-sel{border-color:#00C73C;background:rgba(0,199,60,.18)}
.kd-dx-opt b{color:#00C73C;margin-right:8px}
.kd-dx-hint{color:#FFFFFF;opacity:.8;font-size:14px;margin:-4px 0 20px!important}
.kd-dx-light{width:96px;height:96px;border-radius:50%;margin:0 0 20px;box-shadow:0 0 0 8px rgba(255,255,255,.08),0 0 40px var(--c)}
.kd-dx-score{font-weight:700;font-size:15px;margin:0 0 20px!important}
.kd-dx-hl{border-left:4px solid var(--c);padding:4px 0 4px 16px;font-weight:700;font-size:18px;margin:24px 0!important}
.kd-dx-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:24px 0}
.kd-dx-col{border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:20px;background:rgba(0,0,0,.18)}
.kd-dx-col h3{font-size:16px;margin-bottom:12px}
.kd-dx-col ul{margin:0;padding:0;list-style:none}
.kd-dx-col li{margin:0 0 12px;font-size:14px}
.kd-dx-col li:last-child{margin:0}
.kd-dx-mini{height:6px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
.kd-dx-mini>i{display:block;height:100%}
.kd-dx-legal{margin-top:28px!important;padding-top:20px;border-top:1px solid rgba(255,255,255,.35);font-size:13px;opacity:.85}
.kd-dx [hidden]{display:none!important}
@media (max-width:640px){.kd-dx-card{padding:24px}.kd-dx h2{font-size:28px!important}}

/* Quiénes somos: misión, visión y por qué elegirnos */
.kd-nos-wrap{flex:1 1 100%;margin-top:8px}
.kd-nos-mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.kd-nos-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#3E3E3E 0%,#2B2928 100%);border:1px solid #FFFFFF;border-radius:20px;padding:36px;box-sizing:border-box;transition:transform .25s ease,border-color .25s ease}
.kd-nos-card:hover{transform:translateY(-4px);border-color:#00C73C}
.kd-nos-card:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:#00C73C}
.kd-nos-ico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(0,199,60,.14);border:1px solid rgba(0,199,60,.55);margin-bottom:20px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:#00C73C}
.kd-nos-ico.is-emoji{font-size:26px}
.kd-nos-card h3{margin:0 0 8px;font-family:'Montserrat',sans-serif;font-size:26px;line-height:1.2;color:#FFFFFF}
.kd-nos-line{width:48px;height:3px;border-radius:99px;background:#00C73C;margin:0 0 16px}
.kd-nos-card p{margin:0;color:#FFFFFF;font-size:17px;line-height:1.6}
.kd-nos-why{margin-top:56px}
.kd-nos-why h3{margin:0 0 28px;font-family:'Montserrat',sans-serif;font-size:32px;line-height:1.2;color:#FFFFFF}
.kd-nos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.kd-nos-grid .kd-nos-card{padding:28px}
.kd-nos-grid .kd-nos-card h4{margin:0 0 10px;font-family:'Montserrat',sans-serif;font-size:18px;line-height:1.3;color:#FFFFFF}
.kd-nos-grid .kd-nos-card p{font-size:15px}
@media (max-width:640px){.kd-nos-card{padding:28px}.kd-nos-why h3{font-size:26px}}

/* Formulario de contacto del diagnóstico */
.kd-dx-form{margin:24px 0 0}
.kd-dx-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 16px}
.kd-dx-field{display:flex;flex-direction:column;min-width:0}
.kd-dx-field>label{font-size:14px;margin:0 0 6px;color:#FFFFFF}
.kd-dx-in{width:100%;box-sizing:border-box;height:56px;background:transparent;color:#FFFFFF;border:1px solid rgba(255,255,255,.55);border-radius:14px;padding:0 20px;font-family:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s}
.kd-dx-in::placeholder{color:rgba(255,255,255,.7)}
.kd-dx-in:focus{outline:none;border-color:#00C73C;box-shadow:0 0 0 3px rgba(0,199,60,.2)}
.kd-dx-in.is-bad{border-color:#E5484D}
.kd-dx-robot{display:inline-flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.55);border-radius:12px;padding:16px 22px;background:rgba(0,0,0,.18);cursor:pointer;user-select:none;margin:8px 0 20px}
.kd-dx-robot input{position:absolute;opacity:0;pointer-events:none}
.kd-dx-box{width:28px;height:28px;border:2px solid #FFFFFF;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#23201F;font-weight:700;transition:background .2s,border-color .2s}
.kd-dx-robot input:checked+.kd-dx-box{background:#00C73C;border-color:#00C73C}
.kd-dx-robot input:checked+.kd-dx-box:after{content:"✓"}
.kd-dx-robot input:focus-visible+.kd-dx-box{box-shadow:0 0 0 3px rgba(0,199,60,.4)}
.kd-dx-robot.is-bad{border-color:#E5484D}
.kd-dx-auth{font-size:14px;text-align:center;max-width:560px;margin:0 auto 20px!important}
.kd-dx-auth a{color:#00C73C;font-weight:700;text-decoration:underline}
.kd-dx-err{color:#FF8A8E;font-size:14px;min-height:20px;margin:0 0 12px!important;text-align:center}
.kd-dx-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.kd-dx-btn:disabled{opacity:.6;cursor:wait}
.kd-dx-err.is-ok{color:#00C73C}
.kd-hl{font-weight:700;color:#00C73C}
@media (max-width:640px){.kd-dx-row{grid-template-columns:1fr}}

/* Texto justificado */
p,li,footer,body>div>div:first-child,.kd-role,.kd-email,.kd-amv,.kd-dx-opt,.kd-dx-pill b{text-align:justify!important}
/* Sin justificar: "Por qué elegirnos" */
.kd-nos-why,.kd-nos-why *{text-align:start!important}

html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}

div[style*="max-width:1200px"]{padding:0 18px!important}
/* Encabezado y menú */
header{flex-direction:column;align-items:center!important;gap:14px!important;padding:18px 0!important}
nav{justify-content:center;gap:6px 18px!important;font-size:14px!important}

.kd-slide>div:first-child,.kd-slide>div:last-child{flex:1 1 100%!important}
.kd-slide>div:last-child{border-radius:16px!important}
